name: Sync upstream and build

# 只在需要时手动触发（Actions → Sync upstream and build → Run workflow），
# 上游发新版不会自动合并，避免在你不想要的时候突然变版本。
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ceru-sync-bot"
          git config user.email "ceru-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/baipiao5555/CeruMusic-Mobile.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已经是最新，无需同步"
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            git push origin HEAD:main
            echo "已同步上游，正在触发构建"
            gh workflow run build-apk.yml --ref main || echo "触发构建失败，请手动运行 Build APK"
          else
            git merge --abort || true
            echo "::error::上游更新与本地改动冲突，需要人工处理（找 DSH 里的助手）"
            exit 1
          fi
